# Render Blueprint — free Web Service for the Rust API (Docker).
# Dashboard: New → Blueprint → connect gabltz/uni-share
# Or: New → Web Service → Docker → this repo
#
# Free tier spins down after idle time; the first request after sleep can take
# ~30–60s (cold start). The Apple Shortcut should tolerate that delay.

services:
  - type: web
    name: uni-share-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DEFAULT_COUNTRY
        value: US
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SHORTCUT_INSTALL_URL
        sync: false
