name: Deploy API (Fly.io)

# Runs only when you trigger it (Actions → Deploy API → Run workflow).
# Requires repository secret FLY_API_TOKEN (fly tokens create).
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require FLY_API_TOKEN
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "Add repository secret FLY_API_TOKEN before deploying."
            echo "On a machine with flyctl: fly auth login && fly tokens create deploy -x 999999h"
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
